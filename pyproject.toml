[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "datacentet-dt"
version = "0.1.0"
description = "Scientific Digital Twin core"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = [
    "postgres: marks tests requiring a running local PostgreSQL instance",
    "kafka: marks tests requiring Kafka adapter runtime",
]
